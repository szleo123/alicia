use_gazebo: false

command_in_type: speed_units
scale:
  linear: 1.0
  rotational: 1.0
  joint: 1.0

publish_period: 0.02
low_latency_mode: true

command_out_type: trajectory_msgs/JointTrajectory
publish_joint_positions: true
publish_joint_velocities: true
publish_joint_accelerations: false
smoothing_filter_plugin_name: online_signal_smoothing::ButterworthFilterPlugin

is_primary_planning_scene_monitor: false
move_group_name: Alicia
planning_frame: base_link
ee_frame_name: tool0
robot_link_command_frame: base_link

incoming_command_timeout: 0.15
num_outgoing_halt_msgs_to_publish: 4
halt_all_joints_in_joint_mode: true
halt_all_joints_in_cartesian_mode: true

lower_singularity_threshold: 25.0
hard_stop_singularity_threshold: 45.0
joint_limit_margin: 0.10
leaving_singularity_threshold_multiplier: 2.0
override_velocity_scaling_factor: 0.30

cartesian_command_in_topic: /alicia_d_teleop/twist_cmd
joint_command_in_topic: /alicia_d_teleop/joint_delta_cmds
joint_topic: /joint_states
status_topic: /alicia_d_teleop/servo_status
command_out_topic: /Alicia_controller/joint_trajectory

check_collisions: true
collision_check_rate: 10.0
self_collision_proximity_threshold: 0.02
scene_collision_proximity_threshold: 0.03
